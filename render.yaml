services:
  - type: web
    name: ghali-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: GHALI_LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: GHALI_WEB_SEARCH
        value: "false"
      - key: GHALI_ENABLE_SETUP
        value: "false"
      - key: GHALI_ADMIN_USER
        value: ghaly
      - key: GHALI_ADMIN_PASSWORD
        sync: false
      - key: GHALI_DATABASE_PATH
        value: /app/data/ghali.db
      - key: GHALI_KNOWLEDGE_PATH
        value: /app/data/knowledge
      - key: PORT
        value: 8765
    disk:
      name: ghali-data
      mountPath: /app/data
      sizeGB: 10
